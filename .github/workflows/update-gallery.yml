name: Weekly Gallery Update

on:
  schedule:
    # Esto significa: Minuto 0, Hora 0 (UTC), cualquier día del mes, cualquier mes, el día 0 de la semana (Domingo)
    - cron: '0 0 * * 0'
  # Esta línea agrega un botón para que puedas ejecutarlo a mano cuando quieras
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    # Permiso necesario para que el bot pueda subir el JSON nuevo a tu repositorio
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run extraction script
        env:
          # Aquí GitHub inyecta tus claves secretas al script de Python
          DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}
          DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}
        run: python extractor.py

      - name: Commit and push changes
        run: |
          # Configuramos el bot de GitHub
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Agregamos el JSON actualizado
          git add public/gallery.json

          # Si hubo cambios, hace el commit y lo sube. Si la galería está igual, no hace nada.
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update gallery.json from API" && git push)
